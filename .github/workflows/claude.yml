name: Claude Code

# Triggered by mentioning @claude in an issue or PR comment. This is how you
# hand off a ROADMAP.md ticket without opening a local or cloud session
# yourself — comment "@claude implement ticket 0.2" on the tracking issue and
# it opens a PR. It never merges; that's still a human step.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  respond:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # No prompt override here — the action reads CLAUDE.md and
          # ROADMAP.md automatically (same as any Claude Code session) and
          # responds to whatever was asked in the comment.
